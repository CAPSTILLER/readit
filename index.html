<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1614" />
  <meta name="description" content="Paste text and hear it read aloud — Readit by Capstiller" />
  <title>Readit — paste &amp; listen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◉</span>
        <h1>Readit</h1>
      </div>
      <p class="tagline">Paste text. Pick a voice. Listen.</p>
    </header>

    <main class="main">
      <div id="unsupported" class="banner banner-error" hidden>
        Speech synthesis is not available in this browser. Try Safari, Chrome, or Edge.
      </div>

      <label class="sr-only" for="text">Text to read</label>
      <textarea
        id="text"
        class="textarea"
        rows="10"
        placeholder="Paste or type text here…"
        autocomplete="off"
        spellcheck="true"
      ></textarea>

      <div class="meta" aria-live="polite">
        <span id="counts">0 words · 0 characters</span>
      </div>

      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice" class="select" disabled>
          <option value="">Loading voices…</option>
        </select>
      </div>

      <div class="field field-rate">
        <label for="rate">
          Speed
          <span id="rate-value" class="rate-value">1.0×</span>
        </label>
        <input
          id="rate"
          class="range"
          type="range"
          min="0.75"
          max="1.5"
          step="0.05"
          value="1"
        />
        <div class="range-labels" aria-hidden="true">
          <span>0.75×</span>
          <span>1.5×</span>
        </div>
      </div>

      <div class="controls" role="group" aria-label="Playback">
        <button type="button" id="play" class="btn btn-primary" disabled>
          Play
        </button>
        <button type="button" id="pause" class="btn btn-secondary" disabled>
          Pause
        </button>
        <button type="button" id="stop" class="btn btn-secondary" disabled>
          Stop
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>Uses your device’s voices (Web Speech API) — no account needed.</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
